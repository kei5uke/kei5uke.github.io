name: Deploy blog to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/.gitignore"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quartz
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so Quartz can read note dates from git

      - uses: actions/setup-node@v6
        with:
          node-version-file: quartz/.node-version
          cache: npm
          cache-dependency-path: quartz/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npm run install-plugins

      - name: Build site
        run: npx quartz build -d ../content

      - uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
